
name: Generate dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: Generate hash-locked dependencies
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install lockfile generator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m pip install "pip==25.2"
          if ($LASTEXITCODE -ne 0) {
            throw "pip installation failed."
          }

          python -m pip install "pip-tools==7.5.2"
          if ($LASTEXITCODE -ne 0) {
            throw "pip-tools installation failed."
          }

      - name: Generate hash-locked dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m piptools compile `
            --generate-hashes `
            --allow-unsafe `
            --resolver=backtracking `
            --output-file=requirements-lock.txt `
            requirements.txt

          if ($LASTEXITCODE -ne 0) {
            throw "Lockfile generation failed."
          }

          if (-not (Test-Path "requirements-lock.txt")) {
            throw "Lockfile was not created."
          }

      - name: Verify hash-locked dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m pip install `
            --dry-run `
            --require-hashes `
            -r requirements-lock.txt

          if ($LASTEXITCODE -ne 0) {
            throw "Hash verification failed."
          }

      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: requirements-lock
          path: requirements-lock.txt
          if-no-files-found: error
          retention-days: 14
