
name: Generate dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: Generate hash-locked dependencies
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install lockfile generator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m pip install "pip==25.2"
          if ($LASTEXITCODE -ne 0) {
            throw "pip installation failed."
          }

          python -m pip install "pip-tools==7.5.2"
          if ($LASTEXITCODE -ne 0) {
            throw "pip-tools installation failed."
          }

      - name: Generate hash-locked dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m piptools compile `
            --generate-hashes `
            --allow-unsafe `
            --resolver=backtracking `
            --output-file=requirements-lock.txt `
            requirements.txt

          if ($LASTEXITCODE -ne 0) {
            throw "Lockfile generation failed."
          }

          if (-not (Test-Path "requirements-lock.txt")) {
            throw "Lockfile was not created."
          }

      - name: Verify hash-locked dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m pip install `
            --dry-run `
            --require-hashes `
            -r requirements-lock.txt

          if ($LASTEXITCODE -ne 0) {
            throw "Hash verification failed."
          }

      - name: Upload generated lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: requirements-lock
          path: requirements-lock.txt
          if-no-files-found: error
          retention-days: 14
