name: Generate dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate hash-locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-tools==7.5.2"
          python -m piptools compile --generate-hashes --resolver=backtracking --output-file=requirements-lock.txt requirements.txt
          python -m pip install --dry-run --require-hashes -r requirements-lock.txt
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: requirements-lock.txt
          if-no-files-found: error
          retention-days: 14
