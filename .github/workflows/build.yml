name: Windows portable build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name AIJatekasszisztens --icon src/app.ico --add-data "src/app.ico;." --collect-submodules keyring.backends src/assistant.py
      - uses: actions/upload-artifact@v4
        with:
          name: AIJatekasszisztens-unsigned
          path: dist/AIJatekasszisztens/
