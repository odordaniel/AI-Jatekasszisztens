name: Windows portable build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check Python syntax
        run: python -m py_compile src/assistant.py
      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name AIJatekasszisztens --icon src/app.ico --add-data "src/app.ico;." --collect-submodules keyring.backends src/assistant.py
      - name: Verify output and create SHA256 manifest
        shell: pwsh
        run: |
          $exe = 'dist/AIJatekasszisztens/AIJatekasszisztens.exe'
          if (-not (Test-Path $exe)) { throw 'EXE missing from build output' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AIJatekasszisztens.exe" | Set-Content -Encoding ascii 'dist/AIJatekasszisztens/SHA256SUMS.txt'
      - name: Upload unsigned portable build
        uses: actions/upload-artifact@v4
        with:
          name: AIJatekasszisztens-unsigned
          path: dist/AIJatekasszisztens/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish versioned release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: AIJatekasszisztens-unsigned
          path: package/AIJatekasszisztens
      - name: Package portable ZIP and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid release tag: $tag" }
          $exe = 'package/AIJatekasszisztens/AIJatekasszisztens.exe'
          if (-not (Test-Path $exe)) { throw 'Missing executable in artifact' }
          $archive = "AIJatekasszisztens-$tag-Windows-portable.zip"
          Compress-Archive -Path 'package/AIJatekasszisztens' -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii 'SHA256SUMS.txt'
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $archive = "AIJatekasszisztens-$tag-Windows-portable.zip"
          gh release create "$tag" "$archive" 'SHA256SUMS.txt' --verify-tag --title "AI Játékasszisztens $tag" --notes "Windows portable ZIP (unsigned). Extract the entire folder before running AIJatekasszisztens.exe. Code signing via SignPath Foundation is pending approval; this release is not signed."
