
name: Windows portable build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build and publish (optional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Windows application
    runs-on: windows-latest

    outputs:
      release_tag: ${{ steps.release_info.outputs.tag }}

    steps:
      - name: Determine release tag
        id: release_info
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = ""

          if ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:INPUT_TAG) {
            $tag = $env:INPUT_TAG.Trim()
          }
          elseif ($env:REF_TYPE -eq "tag") {
            $tag = $env:REF_NAME
          }

          if ($tag -and $tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid version tag: $tag"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_info.outputs.tag || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install hash-verified dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip check

      - name: Check Python syntax
        shell: pwsh
        run: |
          python -m py_compile src/assistant.py

      - name: Build portable EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name AIJatekasszisztens `
            --icon src/app.ico `
            --add-data "src/app.ico;." `
            --collect-submodules keyring.backends `
            src/assistant.py

      - name: Verify build
        shell: pwsh
        run: |
          $exe = "dist/AIJatekasszisztens/AIJatekasszisztens.exe"

          if (-not (Test-Path $exe)) {
            throw "EXE not found: $exe"
          }

          Get-FileHash $exe -Algorithm SHA256

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIJatekasszisztens-unsigned
          path: dist/AIJatekasszisztens/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned release
    needs: build
    if: needs.build.outputs.release_tag != ''
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: AIJatekasszisztens-unsigned
          path: package/AIJatekasszisztens

      - name: Package portable ZIP and checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          $archive = "AIJatekasszisztens-$env:RELEASE_TAG-Windows-portable.zip"

          Compress-Archive `
            -Path "package/AIJatekasszisztens" `
            -DestinationPath $archive `
            -Force

          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()

          "$hash  $archive" | Set-Content `
            -Path SHA256SUMS.txt `
            -Encoding ascii

          if (-not (Test-Path $archive)) {
            throw "Release ZIP was not created."
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = $env:RELEASE_TAG
          $archive = "AIJatekasszisztens-$tag-Windows-portable.zip"

          $notes = @"
          Windows portable ZIP (unsigned).

          Extract the entire ZIP before running AIJatekasszisztens.exe.

          Code signing via SignPath Foundation is pending approval.
          "@

          gh release view "$tag" --repo "$env:GH_REPO" *> $null
          $exists = ($LASTEXITCODE -eq 0)

          if ($exists) {
            Write-Host "Existing release found: $tag"

            gh release upload "$tag" `
              "$archive" `
              "SHA256SUMS.txt" `
              --clobber `
              --repo "$env:GH_REPO"
          }
          else {
            Write-Host "Creating release: $tag"

            gh release create "$tag" `
              "$archive" `
              "SHA256SUMS.txt" `
              --verify-tag `
              --title "AI Játékasszisztens $tag" `
              --notes "$notes" `
              --repo "$env:GH_REPO"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publishing failed."
          }

          Write-Host "Release published successfully: $tag"
