name: Windows portable build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build and publish (optional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Windows application
    runs-on: windows-2025
    timeout-minutes: 30

    outputs:
      release_tag: ${{ steps.release_info.outputs.tag }}

    steps:
      - name: Determine release tag
        id: release_info
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = ''

          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:INPUT_TAG) {
            $tag = $env:INPUT_TAG.Trim()
          }
          elseif ($env:REF_TYPE -eq 'tag') {
            $tag = $env:REF_NAME
          }

          if ($tag -and $tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid version tag: $tag"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.release_info.outputs.tag || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install hash-verified dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m pip install --require-hashes -r requirements-lock.txt
          if ($LASTEXITCODE -ne 0) {
            throw 'Dependency installation failed.'
          }

          python -m pip check
          if ($LASTEXITCODE -ne 0) {
            throw 'Dependency consistency check failed.'
          }

          python -m PyInstaller --version
          if ($LASTEXITCODE -ne 0) {
            throw 'PyInstaller is not installed.'
          }

      - name: Check Python syntax
        shell: pwsh
        run: |
          python -m py_compile src/assistant.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Python syntax check failed.'
          }

      - name: Build portable EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name AIJatekasszisztens `
            --icon src/app.ico `
            --add-data "src/app.ico;." `
            --collect-submodules keyring.backends `
            src/assistant.py

          if ($LASTEXITCODE -ne 0) {
            throw 'PyInstaller build failed.'
          }

      - name: Verify build
        shell: pwsh
        run: |
          $exe = 'dist/AIJatekasszisztens/AIJatekasszisztens.exe'

          if (-not (Test-Path $exe)) {
            throw "EXE not found: $exe"
          }

          Get-FileHash $exe -Algorithm SHA256

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AIJatekasszisztens-unsigned
          path: dist/AIJatekasszisztens/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned release
    needs: build
    if: needs.build.outputs.release_tag != ''
    runs-on: windows-2025
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download verified build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: AIJatekasszisztens-unsigned
          path: package/AIJatekasszisztens

      - name: Package portable ZIP and checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          $archive = "AIJatekasszisztens-$env:RELEASE_TAG-Windows-portable.zip"

          $exe = 'package/AIJatekasszisztens/AIJatekasszisztens.exe'

          if (-not (Test-Path $exe)) {
            throw "EXE missing from downloaded artifact: $exe"
          }

          Compress-Archive `
            -Path 'package/AIJatekasszisztens' `
            -DestinationPath $archive `
            -Force

          if (-not (Test-Path $archive)) {
            throw 'Release ZIP was not created.'
          }

          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()

          "$hash  $archive" | Set-Content `
            -Path SHA256SUMS.txt `
            -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = $env:RELEASE_TAG
          $archive = "AIJatekasszisztens-$tag-Windows-portable.zip"

          $notes = @"
          Windows portable ZIP (unsigned).

          Extract the entire ZIP before running AIJatekasszisztens.exe.

          This application is currently unsigned.
          "@

          gh release view "$tag" --repo "$env:GH_REPO" *> $null
          $exists = ($LASTEXITCODE -eq 0)

          if ($exists) {
            Write-Host "Updating existing release: $tag"

            gh release upload "$tag" `
              "$archive" `
              'SHA256SUMS.txt' `
              --clobber `
              --repo "$env:GH_REPO"
          }
          else {
            Write-Host "Creating release: $tag"

            gh release create "$tag" `
              "$archive" `
              'SHA256SUMS.txt' `
              --verify-tag `
              --title "AI Játékasszisztens $tag" `
              --notes "$notes" `
              --repo "$env:GH_REPO"
          }

          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release publishing failed.'
          }

          Write-Host "Release published successfully: $tag"
