name: Akadálymentességi probléma
description: Billentyűzetes használat, olvashatóság vagy segédtechnológia melletti akadály jelzése.
title: "[Akadálymentesség]: "
body:
  - type: markdown
    attributes:
      value: |
        Nem szükséges egészségi állapotot vagy fogyatékosságot megadnod. Képernyőkép és felvétel sem kötelező. A [nyilatkozat](https://github.com/odordaniel/AI-Jatekasszisztens/blob/main/ACCESSIBILITY.md) ismert korlátokat és egyszerű bejelentési lehetőséget is leír.
  - type: input
    id: version
    attributes:
      label: Alkalmazásverzió
      placeholder: Verzió vagy forrásból futtatásnál commit/ág
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: Hol és miben akadályoz a felület?
      description: Melyik képernyőn mit próbáltál elvégezni, és mi történt helyette?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Releváns környezet
      description: Ha tudod, add meg a Windows verzióját, a nagyítást, a használt beviteli módot vagy a segédtechnológia nevét/verzióját. Csak azt, ami a hiba megértéséhez szükséges.
  - type: textarea
    id: steps
    attributes:
      label: Reprodukálás vagy példa
      description: Opcionális lépések, amelyekkel a probléma előidézhető.
  - type: textarea
    id: improvement
    attributes:
      label: Mi segítene a használatban?
      description: Opcionális. Az elvárt működés, egy alternatív kezelés vagy a jelenleg használt kerülőút.
